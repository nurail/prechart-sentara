<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pre-Chart | Visit Workspace</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div class="avm-prechart-app">
        <main class="two-column-layout" role="main">
            <section class="main-pane" aria-label="Main content">
                <!-- Only ONE main tab -->
                <div class="tabs" role="tablist">
                    <button class="tab ai is-active" role="tab" aria-selected="true" aria-controls="summary-pane" id="tab-summary" data-tab="summary">
              Pre-Visit Summary
            </button>
                </div>

                <div class="side-content">
                    <div class="generated-content" id="generated-content">
                        <section id="summary-pane" class="pane is-active" role="tabpanel" aria-labelledby="tab-summary">
                            <!-- Sub-tabs -->
                            <div class="summary-tabs" role="tablist">
                                <button class="summary-tab is-active" role="tab" aria-selected="true" aria-controls="encounter-summary-content" id="tab-encounter-summary" data-summary-tab="encounter-summary">
                    Visit Summary
                  </button>
                                <button class="summary-tab" role="tab" aria-selected="false" aria-controls="questionnaire-summary-content" id="tab-questionnaire-summary" data-summary-tab="questionnaire-summary">
                    Patient Intake Questionnaire
                  </button>
                            </div>

                            <!-- Sub-tab content -->
                            <div class="summary-content">
                                <section id="encounter-summary-content" class="summary-pane is-active"></section>
                                <section id="questionnaire-summary-content" class="summary-pane"></section>
                            </div>
                        </section>
                    </div>
                </div>
            </section>

            <!-- Right side panel (unchanged) -->
            <aside class="side-pane" aria-label="Right panel">
                <div id="cards-container" class="cards-grid" aria-live="polite"></div>

                <div class="feedback-container">
                    <div class="feedback-group">
                        <div class="feedback-question">Was this information helpful?</div>
                        <div class="feedback-actions">
                            <img id="thumbsUpBtn" class="feedback-icon" alt="Thumbs up" src="https://s3.us-west-1.amazonaws.com/static.aiavaamo.com/icons/uil_thumbs-up.svg" />
                            <img id="thumbsDownBtn" class="feedback-icon" alt="Thumbs down" src="https://s3.us-west-1.amazonaws.com/static.aiavaamo.com/icons/uil_thumbs-down.svg" />
                        </div>
                    </div>

                    <!-- Positive feedback card -->
                    <div id="positiveFeedback" class="feedback-card hidden">
                        <div class="feedback-wrapper">
                            <div class="feedback-group-content">
                                <div class="feedback-message">
                                    Great! Anything we can do to make it even better?
                                </div>
                                <div class="feedback-comments">
                                    <div class="feedback-label">Comments</div>
                                    <textarea id="positiveComments" name="positiveComments" class="feedback-input"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="feedback-actions-row">
                            <button class="feedback-btn dismiss">Dismiss</button>
                            <button class="feedback-btn submit">Submit</button>
                        </div>
                    </div>

                    <!-- Negative feedback card -->
                    <div id="negativeFeedback" class="feedback-card hidden">
                        <div class="feedback-wrapper">
                            <div class="feedback-group-content">
                                <div class="feedback-message">
                                    Sorry it wasn’t helpful. Tell us what didn’t work?
                                </div>
                                <div class="feedback-comments">
                                    <div class="feedback-label">Comments</div>
                                    <textarea id="negativeComments" name="negativeComments" class="feedback-input"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="feedback-actions-row">
                            <button class="feedback-btn dismiss">Dismiss</button>
                            <button class="feedback-btn submit">Submit</button>
                        </div>
                    </div>
                </div>

                <div class="footer-branding">
                    <span class="footer-text">Powered by</span>
                    <img class="footer-logo" alt="Company Logo" src="https://s3.us-west-1.amazonaws.com/static.aiavaamo.com/icons/avaamo_icon.svg" />
                </div>
            </aside>
        </main>
    </div>

    <script src="./app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pre-Chart | Visit Workspace</title>
    <style>
        /* Base reset */
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        /* Global application wrapper */
        
        .avm-prechart-app {
            height: 100%;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            color: #0f172a;
            background: #fff;
            margin: 0;
        }
        
        .avm-prechart-app .app-header {
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: #111827;
            color: #fff;
            border-bottom: 1px solid #0b1220;
        }
        
        .avm-prechart-app .brand {
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        
        .avm-prechart-app .two-column-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 16px;
            padding: 16px;
            max-width: 1800px;
            justify-self: center;
        }
        
        .avm-prechart-app .main-pane {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0px;
            position: relative;
        }
        
        .avm-prechart-app .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }
        
        .avm-prechart-app .card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
        }
        
        .avm-prechart-app .card header {
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f7;
            font-weight: 600;
            color: #111827;
            border-top-right-radius: 10px;
            border-top-left-radius: 10px;
        }
        
        .avm-prechart-app .card .card-body {
            padding: 12px;
            font-size: 14px;
            color: #374151;
        }
        
        .avm-prechart-app .kv {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 8px 10px;
        }
        
        .avm-prechart-app .kv .k {
            color: #6b7280;
        }
        
        .avm-prechart-app .kv .v {
            color: #111827;
        }
        
        .avm-prechart-app .kv-container {
            margin-top: 0px;
        }
        
        .avm-prechart-app .kv-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 8px 12px;
            padding: 8px 12px;
            border-bottom: 1px solid #dae1e7;
            /* border-bottom: 1px solid #f1f5f9; */
        }
        
        .avm-prechart-app .kv-row:last-child {
            border-bottom: none;
        }
        
        .avm-prechart-app .kv-row .k {
            color: #111827;
            font-weight: 600;
            font-size: 13px;
        }
        
        .avm-prechart-app .kv-row .v {
            color: #6b7280;
            line-height: 1.4;
        }
        
        .avm-prechart-app .bullets {
            margin: 8px 0 0 18px;
        }
        
        .avm-prechart-app .bullets li {
            margin: 4px 0;
        }
        
        .avm-prechart-app .source {
            margin-top: 10px;
            font-size: 12px;
            color: #475569;
            background: #f1f5f9;
            padding: 6px 8px;
            border-radius: 6px;
            display: inline-block;
        }
        
        .avm-prechart-app .highlight {
            margin-top: 10px;
            padding: 10px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 8px;
        }
        
        .avm-prechart-app .section-title {
            font-weight: 600;
            margin-bottom: 4px;
            color: #92400e;
        }
        
        .avm-prechart-app .side-pane {
            display: flex;
            flex-direction: column;
            background: transparent;
            border: 0px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .avm-prechart-app .footer-branding {
            position: fixed;
            /* Sticks it to the viewport */
            bottom: 20px;
            /* Distance from bottom */
            right: 20px;
            /* Distance from right */
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 14px;
            font-family: Inter, sans-serif;
            color: #89a2b7;
            z-index: 9999;
            /* Ensures it stays above other elements */
        }
        
        .avm-prechart-app .footer-text {
            margin-right: 6px;
            line-height: 1;
        }
        
        .avm-prechart-app .footer-logo {
            width: 64px;
            height: auto;
        }
        
        .avm-prechart-app .tabs {
            display: flex;
            /* border-bottom: 1px solid #e5e7eb; */
            background: #e4ecfa;
        }
        
        .avm-prechart-app .tab {
            flex: 1 1 0;
            padding: 12px 14px;
            background: #e4ecfa;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #475569;
        }
        
        .avm-prechart-app .tab.is-active {
            color: #0f172a;
            background: #fff;
        }
        /* AI sparkle treatment */
        
        .avm-prechart-app .tab.ai {
            position: relative;
            overflow: hidden;
        }
        
        .avm-prechart-app .tab.ai::after,
        .avm-prechart-app .tab.ai::before {
            content: '✨';
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 12px;
            opacity: 0.85;
            transform-origin: center;
            animation: sparkle-float 3s ease-in-out infinite;
        }
        
        .avm-prechart-app .tab.ai::before {
            content: '✦';
            right: 20px;
            top: 50%;
            font-size: 10px;
            opacity: 0.6;
            animation-delay: 1s;
        }
        
        .avm-prechart-app .tab.ai.is-active {
            /* box-shadow: inset 0 -2px 0 0 #5c2bee; */
            box-shadow: inset 0px 3px 0px 0px #e4ecfa;
            font-size: 24px;
            color: #5c2bee;
            background-color: #fff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom: 0;
            cursor: default;
        }
        
        .avm-prechart-app .tab.ai.is-active::after,
        .avm-prechart-app .tab.ai.is-active::before {
            color: #7c3aed;
        }
        
        @keyframes sparkle-float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-2px) rotate(10deg);
                opacity: 1;
            }
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
        }
        
        .avm-prechart-app .tab:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: -2px;
        }
        
        .avm-prechart-app .side-content {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 400px;
            min-width: 60vw;
        }
        /* date-rail removed per updated design */
        
        .avm-prechart-app .generated-content {
            padding: 12px;
        }
        /* Date pills (top of Visit Summary) */
        
        .avm-prechart-app .date-pills {
            /* display: flex; */
            display: grid;
            grid-template-columns: repeat(5, auto);
            gap: 10px;
            padding: 6px 0 12px;
            flex-wrap: wrap;
        }
        
        .avm-prechart-app .date-pill {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            cursor: pointer;
            color: #334155;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
            /* width: 174px; */
            height: 50px;
            max-width: 300px;
            place-content: center;
        }
        
        .avm-prechart-app .date-pill .date-line {
            font-weight: 600;
            font-size: 14px;
        }
        
        .avm-prechart-app .date-pill .status-line {
            font-size: 12px;
            color: #4d5469;
        }
        
        .date-pill.is-active .status-line {
            color: #642bf3;
        }
        
        .avm-prechart-app .date-pill.is-active {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #1e293b;
        }
        
        .avm-prechart-app .ai-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 8px;
        }
        
        .avm-prechart-app .ai-label {
            font-weight: 600;
            color: #7c3aed;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .avm-prechart-app .ai-label::before {
            content: '✨';
        }
        
        .avm-prechart-app .sample-switch {
            display: inline-flex;
            gap: 6px;
        }
        
        .avm-prechart-app .sample-btn {
            border: 1px solid #e5e7eb;
            background: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
        }
        
        .avm-prechart-app .sample-btn.is-active {
            background: #eef2ff;
            color: #1e293b;
            border-color: #c7d2fe;
        }
        
        .avm-prechart-app .pane {
            display: none;
        }
        
        .avm-prechart-app .pane.is-active {
            display: block;
            position: relative;
        }
        /* subtle AI glow on active panel */
        
        .avm-prechart-app .pane.is-active::after {
            content: 'AI';
            position: absolute;
            top: -8px;
            right: -4px;
            font-size: 10px;
            color: #7c3aed;
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            border-radius: 6px;
            padding: 2px 6px;
        }
        /* Modern Skeleton Loading Design */
        
        .avm-prechart-app .skeleton {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 12px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
            overflow: hidden;
        }
        
        .avm-prechart-app .skeleton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient( 90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: skeleton-sweep 2s infinite;
        }
        
        .avm-prechart-app .skeleton .line {
            height: 16px;
            background: linear-gradient( 90deg, #e2e8f0 0%, #cbd5e1 25%, #e2e8f0 50%, #cbd5e1 75%, #e2e8f0 100%);
            background-size: 200% 100%;
            border-radius: 8px;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        
        .avm-prechart-app .skeleton .line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient( 90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: skeleton-shimmer 1.5s infinite;
        }
        
        .avm-prechart-app .skeleton .line.w-80 {
            width: 80%;
        }
        
        .avm-prechart-app .skeleton .line.w-60 {
            width: 60%;
        }
        
        .avm-prechart-app .skeleton .line.w-40 {
            width: 40%;
        }
        
        .avm-prechart-app .skeleton .line.w-90 {
            width: 90%;
        }
        
        .avm-prechart-app .skeleton .line.w-70 {
            width: 70%;
        }
        
        .avm-prechart-app .skeleton .line.w-50 {
            width: 50%;
        }
        
        .avm-prechart-app .skeleton .line.w-30 {
            width: 30%;
        }
        /* AI Loading Header */
        
        .avm-prechart-app .ai-loading {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
            color: white;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            margin-bottom: 8px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
            position: relative;
            overflow: hidden;
            min-width: 60vw;
        }
        
        .avm-prechart-app .ai-loading::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient( 90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: ai-sweep 2.5s infinite;
        }
        
        .avm-prechart-app .ai-loading .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            animation: ai-dots 1.4s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }
        
        .avm-prechart-app .ai-loading .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .avm-prechart-app .ai-loading .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        .avm-prechart-app .ai-loading .dot:nth-child(4) {
            animation-delay: 0.6s;
        }
        /* Enhanced Animations */
        
        @keyframes skeleton-pulse {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }
        
        @keyframes skeleton-shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }
        
        @keyframes skeleton-sweep {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }
        
        @keyframes ai-dots {
            0%,
            80%,
            100% {
                opacity: 0.3;
                transform: scale(0.8) translateY(0);
            }
            40% {
                opacity: 1;
                transform: scale(1.2) translateY(-2px);
            }
        }
        
        @keyframes ai-sweep {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }
        
        .avm-prechart-app .prose {
            line-height: 1.5;
            font-size: 14px;
        }
        
        .avm-prechart-app .prose h4 {
            margin: 12px 0 6px;
        }
        
        .avm-prechart-app .prose ul {
            margin: 6px 0 12px 18px;
        }
        
        .avm-prechart-app .prose li {
            margin: 4px 0;
        }
        
        .avm-prechart-app .summary-box {
            margin: 10px 0 12px;
            padding: 10px 12px;
            background: #fff;
            border: 0px solid #c7d2fe;
            color: #4d5469;
            border-radius: 8px;
            /* font-weight: 600; */
        }
        /* Encounter details card */
        
        .avm-prechart-app .encounter-card {
            border: 0px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            margin: 10px 0 14px;
            position: relative;
        }
        
        .avm-prechart-app .encounter-card header {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 0px solid #eef2f7;
            font-weight: 600;
            background: #fff;
            font-size: 20px;
        }
        
        .avm-prechart-app .encounter-date-chip {
            font-size: 12px;
            color: #475569;
            border: 1px solid #c3d0da;
            border-radius: 44px;
            height: 30px;
            width: 110px;
            place-content: center;
            margin-left: 8px;
        }
        
        .avm-prechart-app .encounter-grid {
            display: grid;
            /* grid-template-columns: repeat(5, minmax(120px, 1fr)); */
            grid-template-columns: repeat(5, auto);
            background-color: #f9f9f9;
        }
        
        .avm-prechart-app .encounter-item {
            padding: 10px 20px;
            font-size: 18px;
            line-height: 28px;
            background: #f5f8ff;
            border: 1px solid var(--Borders, #cad8ef);
            border-radius: 10px;
            margin-top: 12px;
        }
        
        .avm-prechart-app .encounter-item:last-child {
            border-right: none;
        }
        
        .avm-prechart-app .encounter-item .label {
            font-size: 16px;
            color: #000;
            font-weight: 600;
        }
        
        .avm-prechart-app .encounter-item .value {
            font-size: 14px;
            color: #4d5469;
            font-weight: 400;
            margin-top: 4px;
        }
        
        .avm-prechart-app .encounter-item .value.status {
            color: #059669;
        }
        /* Each encounter card wrapper */
        
        .avm-prechart-app .encounter-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            /* subtle gray border */
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin: 2rem 0;
            /* vertical spacing between encounters */
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        /* Encounter header bar */
        
        .avm-prechart-app .encounter-card header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 1rem;
        }
        /* Date chip */
        /* .avm-prechart-app .encounter-date-chip {
          display: inline-flex;
          align-items: center;
          background: #f3f4f6;
          color: #374151;
          font-size: 0.875rem;
          padding: 0.25rem 0.5rem;
          border-radius: 9999px;
      } */
        /* Grid of details inside encounter */
        
        .avm-prechart-app .encounter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem 1rem;
            margin-bottom: 1rem;
        }
        /* Label/value pairs */
        
        .avm-prechart-app .encounter-item .label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        
        .avm-prechart-app .encounter-item .value {
            font-size: 0.9rem;
            color: #111827;
        }
        /* Add a faint divider between encounters */
        
        .avm-prechart-app .prose>.encounter-card:not(:last-child) {
            border-bottom: 2px solid #f9fafb;
            padding-bottom: 0rem;
            margin-bottom: 2rem;
        }
        /* Encounter details header extras */
        
        .avm-prechart-app .encounter-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px 0 12px;
        }
        
        .avm-prechart-app .avatar-badge {
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            background: #e2e8f0;
            color: #334155;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        
        .avm-prechart-app .toggle-container {
            width: 30%;
            position: relative;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            text-align: left;
            font-size: 14px;
            color: #4d5469;
            font-family: Inter, sans-serif;
        }
        
        .avm-prechart-app .toggle-wrapper {
            width: 239px;
            border-radius: 60px;
            background-color: #cad8ef;
            height: 36px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 3px 4px;
            box-sizing: border-box;
        }
        
        .avm-prechart-app .toggle-group {
            width: 204px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            /* gap: 15px; */
        }
        
        .avm-prechart-app .toggle-option {
            width: 195px;
            border-radius: 60px;
            background-color: #fff;
            height: 30px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            padding: 0px 9px;
            box-sizing: border-box;
            gap: 7px;
        }
        
        .avm-prechart-app .toggle-icon {
            width: 20px;
            position: relative;
            max-height: 100%;
        }
        
        .avm-prechart-app .toggle-label {
            width: 146px;
            position: relative;
            font-weight: 600;
            display: flex;
            align-items: center;
            height: 29px;
            flex-shrink: 0;
        }
        
        .avm-prechart-app .toggle-option.active {
            background-color: #fff;
            font-weight: 600;
        }
        
        .avm-prechart-app .toggle-option:not(.active) {
            background-color: transparent;
            font-weight: 400;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        
        .avm-prechart-app .toggle-option:not(.active):hover {
            opacity: 0.8;
        }
        
        .avm-prechart-app .toggle-notes-div {
            justify-self: center;
        }
        
        .avm-prechart-app .btn.toggle-notes {
            margin: 6px 0 8px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #334155;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .avm-prechart-app .btn.toggle-notes:hover {
            background: #f8fafc;
        }
        
        @container (max-height: 1100px) {
            .avm-prechart-app .modal-sheet,
            .avm-prechart-app .side-content {
                height: 110px;
            }
        }
        
        @media (max-width: 1100px) {
            .avm-prechart-app .two-column-layout {
                grid-template-columns: 1fr;
            }
        }
        /* Questionnaire sub-tabs styling - horizontal pills */
        
        .avm-prechart-app .questionnaire-tabs,
        .avm-prechart-app .summary-tabs {
            display: flex;
            gap: 10px;
            padding: 12px 12px 0 12px;
            background: #fff;
            border-bottom: 0px solid #e5e7eb;
        }

    <div class="avm-prechart-app">
        <main class="two-column-layout" role="main">

              Pre-Visit Summary
            </button>
                </div>

                            <div class="summary-tabs" role="tablist">

                                <button class="summary-tab" role="tab" aria-selected="false" aria-controls="questionnaire-summary-content" id="tab-questionnaire-summary" data-summary-tab="questionnaire-summary">
                    Patient Intake Questionnaire
                  </button>

                            <div class="summary-content">
                                <section id="encounter-summary-content" class="summary-pane is-active"></section>
                                <section id="questionnaire-summary-content" class="summary-pane"></section>
                            </div>
                        </section>
                    </div>
                </div>
            </section>

            <!-- Right side panel (unchanged) -->

                <div id="cards-container" class="cards-grid" aria-live="polite"></div>

                <div class="feedback-container">
                    <div class="feedback-group">
                        <div class="feedback-question">Was this solution helpful?</div>
                        <div class="feedback-actions">
                            <img id="thumbsUpBtn" class="feedback-icon" alt="Thumbs up" src="https://s3.us-west-1.amazonaws.com/static.aiavaamo.com/icons/uil_thumbs-up.svg" />
                            <img id="thumbsDownBtn" class="feedback-icon" alt="Thumbs down" src="https://s3.us-west-1.amazonaws.com/static.aiavaamo.com/icons/uil_thumbs-down.svg" />

                    </div>

                                    Great! Anything we can do to make it even better?
                                </div>
                                <div class="feedback-comments">
                                    <div class="feedback-label">Comments</div>
                                    <textarea id="positiveComments" name="positiveComments" class="feedback-input"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="feedback-actions-row">
                            <button class="feedback-btn dismiss">Dismiss</button>
                            <button class="feedback-btn submit">Submit</button>
                        </div>
                    </div>

                    <div id="negativeFeedback" class="feedback-card hidden">
                        <div class="feedback-wrapper">
                            <div class="feedback-group-content">
                                <div class="feedback-message">

                            </div>
                        </div>

                        </div>
                    </div>

        // Utility: simple html element helper
        function elementCreator(tag, attrs = {}, children = []) {
            const node = document.createElement(tag);
            Object.entries(attrs).forEach(([k, v]) => {
                if (k === 'class') node.className = v;
                else if (k === 'html') node.innerHTML = v;
                else node.setAttribute(k, v);
            });
            for (const child of[].concat(children)) {
                if (child == null) continue;
                node.append(child.nodeType ? child : document.createTextNode(String(child)));
            }
            return node;
        };

        // Helper to normalize date strings like YYYY-M-D to YYYY-MM-DD
        function normalizeDateIso(iso) {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        };

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            listViewData.forEach(section => {
                const bodyChildren = [];
                if (section.entries && section.entries.length) {
                    const grid = elementCreator('div', {
                        class: 'kv'
                    });
                    // Avoid Array.flatMap for broader compatibility
                    section.entries.forEach(function(e) {
                        grid.append(elementCreator('div', {
                            class: 'k'
                        }, e.label));
                        grid.append(elementCreator('div', {
                            class: 'v'
                        }, e.value));
                    });
                    bodyChildren.push(grid);
                }
                if (section.bullets && section.bullets.length) {
                    const list = elementCreator('ul', {
                        class: 'bullets'
                    });
                    section.bullets.forEach(function(text) {
                        list.append(elementCreator('li', {}, text));
                    });
                    bodyChildren.push(list);
                }
                if (section.highlight && section.highlight.length) {
                    const h = elementCreator('div', {
                        class: 'highlight'
                    });
                    const hTitle = elementCreator('div', {
                        class: 'section-title'
                    }, 'Highlight');
                    const hList = elementCreator('ul', {
                        class: 'bullets'
                    });
                    section.highlight.forEach(function(text) {
                        hList.append(elementCreator('li', {}, text));
                    });
                    h.append(hTitle, hList);
                    bodyChildren.push(h);
                }
                if (section.source) {
                    bodyChildren.push(elementCreator('div', {
                        class: 'source'
                    }, 'Source: ' + section.source));
                }

                const headerChildren = [];
                if (section.icon) {
                    headerChildren.push(elementCreator('span', {
                        class: 'card-title'
                    }, [elementCreator('img', {
                        class: 'icon-16',
                        src: section.icon,
                        alt: ''
                    }), section.title]));
                } else {
                    headerChildren.push(elementCreator('span', {
                        class: 'card-title'
                    }, section.title));
                }

                var cardClass = 'card';
                if (section.id === 'medications') cardClass += ' card-medications';
                else if (section.id === 'labs') cardClass += ' card-labs';
                else if (section.id === 'imaging') cardClass += ' card-imaging';

                const card = elementCreator('article', {
                    class: cardClass
                }, [
                    elementCreator('header', {
                        class: 'card-header'
                    }, headerChildren),
                    elementCreator('div', {
                        class: 'card-body'
                    }, bodyChildren),
                ]);
                container.append(card);
            });
        };

                ansMap[key] = val;
            });
            const sev = Object.keys(ansMap).find(k => k.toLowerCase().includes('scale'));
            const whenMost = Object.keys(ansMap).find(k => k.toLowerCase().includes('most back pain'));
            const intensified = Object.keys(ansMap).find(k => k.toLowerCase().includes('intensify'));
            const meds = Object.keys(ansMap).find(k => k.toLowerCase().includes('medications improved'));
            const score = Object.keys(ansMap).find(k => k.trim() === '(range: 0 - 3)');
            return `Patient reports back pain severity 7/10, worsening since 08 Aug 2024. Pain is most severe in the morning. Current medications are helpful. Functional impact score: 3/3.`;

        // Modal to show original questionnaire over the entire main pane frame
        function openFullFrameModal(contentNode) {
            const mainPane = document.querySelector('.main-pane');
            if (!mainPane) return;
            // Ensure main pane can host absolutely positioned overlay
            if (!mainPane.style.position) mainPane.style.position = 'relative';

            const overlay = elementCreator('div', {
                class: 'modal-overlay',
                role: 'dialog',
                'aria-modal': 'true'
            });
            const sheet = elementCreator('div', {
                class: 'modal-sheet'
            });
            const closeBtn = elementCreator('button', {
                class: 'modal-close',
                'aria-label': 'Close'
            }, '×');
            closeBtn.addEventListener('click', function() {
                mainPane.removeChild(overlay);
            });
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) mainPane.removeChild(overlay);
            });
            document.addEventListener('keydown', function esc(ev) {
                if (ev.key === 'Escape') {
                    try {
                        mainPane.removeChild(overlay);
                    } catch (e) {}
                    document.removeEventListener('keydown', esc);
                }
            });
            sheet.append(closeBtn, contentNode);
            overlay.append(sheet);
            mainPane.append(overlay);
        }

        function downloadQuestionnaire(filename) {
            // Create PDF using jsPDF
            const {
                jsPDF
            } = window.jspdf;
            const doc = new jsPDF();

            let yPosition = 20;
            const lineHeight = 7;
            const margin = 20;
            const pageWidth = doc.internal.pageSize.width;
            const pageHeight = doc.internal.pageSize.height;

            // Helper function to check if we need a new page
            function checkNewPage(requiredSpace) {
                if (yPosition + requiredSpace > pageHeight - margin) {
                    doc.addPage();
                    yPosition = 20;
                    return true;
                }
                return false;
            }

            // Helper function to add text with word wrapping and page management
            function addWrappedText(text, y, fontSize = 12) {
                doc.setFontSize(fontSize);
                const lines = doc.splitTextToSize(text, pageWidth - 2 * margin);
                const textHeight = lines.length * lineHeight;

                // Check if we need a new page
                if (y + textHeight > pageHeight - margin) {
                    doc.addPage();
                    y = 20;
                }

                doc.text(lines, margin, y);
                return y + textHeight;
            }

            // Helper function to add section header
            function addSectionHeader(text, y) {
                checkNewPage(lineHeight + 10);
                doc.setFontSize(14);
                doc.setFont(undefined, 'bold');
                doc.text(text, margin, y);
                return y + lineHeight + 5;
            }

            // Helper function to add regular text
            function addRegularText(text, y) {
                doc.setFontSize(11);
                doc.setFont(undefined, 'normal');
                return addWrappedText(text, y, 11);
            }

            if (filename.includes('clinical-summary')) {
                // Clinical Summary PDF
                // yPosition = addSectionHeader('Pre-Consultation Brief', yPosition);
                yPosition = addSectionHeader('Outlined below is a pre-consultation brief summarizing key patient details to help guide the upcoming visit.', yPosition);
                yPosition += 5;

                yPosition = addSectionHeader('Patient Overview', yPosition);
                yPosition = addRegularText(clinicalSummaryData.patientOverview, yPosition);
                yPosition += 5;

                yPosition = addSectionHeader('Patient Goals', yPosition);

                yPosition = addRegularText(`Primary Goal: ${originalQuestionnaireData.visitGoalsAndConcerns.primaryGoal}`, yPosition);
                yPosition += 5;
                yPosition = addRegularText('Top 3 Concerns:', yPosition);
                originalQuestionnaireData.visitGoalsAndConcerns.top3Concerns.forEach((concern, index) => {
                    yPosition = addRegularText(`${index + 1}. ${concern}`, yPosition);
                });
            }

            // Save the PDF
            doc.save(filename);
        };

        function feedbackHandlers() {
            const thumbsUpBtn = document.getElementById("thumbsUpBtn");
            const thumbsDownBtn = document.getElementById("thumbsDownBtn");
            const positiveFeedback = document.getElementById("positiveFeedback");
            const negativeFeedback = document.getElementById("negativeFeedback");
            const feedbackGroup = document.querySelector(".feedback-group");
            const feedbackContainer = document.querySelector('.feedback-container');

            thumbsUpBtn.addEventListener("click", () => {
                feedbackGroup.classList.add("hidden"); // hide question + icons
                positiveFeedback.classList.remove("hidden");
                negativeFeedback.classList.add("hidden");
            });

            thumbsDownBtn.addEventListener("click", () => {
                feedbackGroup.classList.add("hidden"); // hide question + icons
                negativeFeedback.classList.remove("hidden");
                positiveFeedback.classList.add("hidden");
            });

            // Dismiss buttons hide everything
            document.querySelectorAll(".feedback-btn.dismiss").forEach(btn =>
                btn.addEventListener("click", () => {
                    positiveFeedback.classList.add("hidden");
                    negativeFeedback.classList.add("hidden");
                    feedbackContainer.style.display = 'none';
                })
            );

            // Dismiss buttons hide everything
            document.querySelectorAll(".feedback-btn.submit").forEach(btn =>
                btn.addEventListener("click", () => {
                    feedbackContainer.innerHTML = 'Thank you for the feedback!';
                    setTimeout(() => {
                        feedbackContainer.style.display = 'none';
                        feedbackContainer.style.backgroundColor = '#642bf3';
                    }, 30000);
                })
            );



        }

        // Initialize app
        function init() {
            renderCards();
            attachTabHandlers();
            attachSummaryTabHandlers();
            // attachQuestionnaireTabHandlers();

            // // default selection
            // setActiveTab('summary');
            // generateContent(visitDates[0], 'summary');

            loadEncounterSummary();
            feedbackHandlers();

        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
